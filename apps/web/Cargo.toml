[package]
name = "lumi-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
lumi-core = { version = "0.5.0", path = "../../crates/lumi-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bip39 = { workspace = true, features = ["rand"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2.17", features = ["js"] }
gloo-net = { version = "0.6.0", features = ["http", "json"] }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.91", features = [
  "Blob",
  "BlobPropertyBag",
  "Document",
  "DocumentFragment",
  "FormData",
  "HtmlDocument",
  "HtmlDialogElement",
  "HtmlElement",
  "Location",
  "Navigator",
  "Clipboard",
  "CssStyleDeclaration",
  "Element",
  "Event",
  "EventTarget",
  "CustomEvent",
  "Node",
  "NodeList",
  "Range",
  "ScrollBehavior",
  "ScrollToOptions",
  "Selection",
  "Storage",
  "Text",
  "Url",
  "Window",
] }

[features]
default = ["web"]
check = ["dioxus/minimal"]
web = ["dioxus/minimal", "dioxus/web", "dioxus/document", "dioxus/asset"]
server = ["dioxus/server"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints]
workspace = true
