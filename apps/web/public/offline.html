<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>Lumi — нет сети</title>
    <style>
      :root { color: #252822; background: #f4f0e8; font: 16px/1.55 system-ui, sans-serif; }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #d9d2c5; border-radius: 1.25rem; background: #fffdf8; box-shadow: 0 18px 60px rgb(45 43 35 / 12%); }
      h1 { margin-block: 0 .75rem; font: 500 clamp(2rem, 8vw, 3.5rem)/1 Georgia, serif; }
      a { display: inline-grid; min-height: 44px; margin-top: 1rem; padding-inline: 1rem; place-items: center; border-radius: .65rem; color: white; background: #315f50; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Lumi</p>
      <h1>Нужна сеть</h1>
      <p>Оболочка приложения доступна, но Lumi не хранит личную библиотеку, тексты, заметки или аудио в публичном кеше. Подключитесь к сети и повторите.</p>
      <a href="/#library">Проверить подключение</a>
    </main>
  </body>
</html>
